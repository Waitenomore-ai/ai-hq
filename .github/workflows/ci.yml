name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: timeout 90s python -m pytest -q
      - name: Validate Compose
        env:
          AI_HQ_DATABASE_URL: postgresql+psycopg://ai_hq:test@postgres:5432/ai_hq
          AI_HQ_REDIS_URL: redis://redis:6379/0
          POSTGRES_DB: ai_hq
          POSTGRES_USER: ai_hq
          POSTGRES_PASSWORD: test-only
        run: |
          cp .env.example .env
          docker compose config

  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Recovery contract tests
        run: |
          python -m pytest -q \
            tests/test_recovery_config.py \
            tests/test_recovery_models.py \
            tests/test_recovery_policy.py \
            tests/test_service_recover_adapter.py \
            tests/test_host_helper_recovery.py \
            tests/test_host_helper_contracts.py \
            tests/test_host_helper_executor.py \
            tests/test_operational_adapters.py \
            tests/test_operational_bootstrap.py \
            tests/test_operational_host_helper_transport.py \
            tests/test_scoped_rule_consumption.py \
            tests/test_scoped_rule_atomic.py \
            tests/test_tool_gateway.py \
            tests/test_safety_service.py
