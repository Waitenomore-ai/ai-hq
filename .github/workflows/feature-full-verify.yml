name: Feature Full Verification

on:
  push:
    branches:
      - feature/developer-qa-orchestration

jobs:
  verify-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint milestone files
        run: >-
          python -m ruff check
          src/ai_hq/delivery/agent_runner.py
          src/ai_hq/delivery/candidate_verifier.py
          src/ai_hq/delivery/repository_workspace.py
          src/ai_hq/missions/worker.py
          src/ai_hq/worker.py
          tests/test_autonomous_worker.py
          tests/test_delivery_agent_runner.py
          tests/test_delivery_candidate_verifier.py
          tests/test_delivery_repository_security_boundary.py
          tests/test_delivery_repository_workspace.py
          tests/test_worker.py
      - name: Full test suite
        run: pytest -v
      - name: Validate Compose
        run: cp .env.example .env && docker compose -f compose.yaml config >/dev/null
