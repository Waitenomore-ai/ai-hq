services:
  web:
    build:
      context: .
      target: web
    command:
    - /app/docker/entrypoint-web.sh
    env_file:
    - ${AI_HQ_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 127.0.0.1:8090:8000
    networks:
    - ai_hq
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',
        timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
    - /opt/ai-hq/repository-mirrors:/srv/ai-hq/repository-mirrors:ro
  worker:
    build:
      context: .
      target: worker
    command:
    - /app/docker/entrypoint-worker.sh
    env_file:
    - ${AI_HQ_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - /run/ai-hq:/run/ai-hq:ro
    - /run/dripvid-mcp:/run/dripvid-mcp:ro
    - /opt/ai-hq/repository-mirrors:/srv/ai-hq/repository-mirrors:ro
    - /opt/ai-hq/repository-sandboxes:/srv/ai-hq/repository-sandboxes
    secrets:
    - source: ai_hq_github_publisher_token
      target: ai-hq-github-publisher-token
      mode: 0400
    - source: dripvid_mcp_token
      target: dripvid-mcp-token
      mode: 0400
    networks:
    - ai_hq
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - ai_hq
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    networks:
    - ai_hq
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  ai_hq:
    name: ai-hq
volumes:
  postgres_data: null
  redis_data: null
secrets:
  ai_hq_github_publisher_token:
    file: ${AI_HQ_GITHUB_PUBLISH_TOKEN_SOURCE:-/dev/null}
  dripvid_mcp_token:
    file: ${AI_HQ_DRIPVID_MCP_TOKEN_SOURCE:-/dev/null}
